---
- name: Configure fairybox # from a fresh rpi os 64 bit lite install
  hosts: fairybox
  become: false
  vars:
    user_uid: 1000
    babashka_version: "1.12.218"
    java_version: "25"
  tasks:
    - name: Install SSH key
      ansible.builtin.copy:
        src: /home/ramblurr/.ssh/casey-all.pub
        dest: /home/ramblurr/.ssh/authorized_keys
        mode: "0640"

    - name: Configure Azul repository
      become: true
      ansible.builtin.deb822_repository:
        name: zulu
        types:
          - deb
        uris:
          - https://repos.azul.com/zulu/deb
        suites:
          - stable
        components:
          - main
        signed_by: https://repos.azul.com/azul-repo.key
        install_python_debian: true
        state: present
      register: azul_repository
      tags: [java]

    - name: Configure Debian backports repository
      become: true
      ansible.builtin.deb822_repository:
        name: bookworm-backports
        types:
          - deb
        uris:
          - http://deb.debian.org/debian
        suites:
          - bookworm-backports
        components:
          - main
        install_python_debian: true
        state: present
      register: backports_repository
      tags: [java]

    - name: Remove legacy APT repository files
      become: true
      ansible.builtin.file:
        path: "/etc/apt/sources.list.d/{{ item }}"
        state: absent
      loop:
        - zulu.list
        - bookworm-backports.list
      register: legacy_apt_sources
      tags: [java]

    - name: Update APT cache after repository changes
      become: true
      ansible.builtin.apt:
        update_cache: true
      when: >-
        azul_repository.changed
        or backports_repository.changed
        or legacy_apt_sources.changed
      tags: [java]

    - name: Remove default packages
      become: true
      ansible.builtin.apt:
        name:
          - python3-rpi.gpio
        state: absent
        update_cache: false

    - name: Install packages
      become: true
      ansible.builtin.apt:
        default_release: bookworm-backports
        name:
          # from debian or debian backports
          - authbind
          - borgmatic
          - ca-certificates
          - curl
          - git
          - gnupg
          - htop
          - kitty-terminfo
          - lsof
          - ncdu
          - pigpio
          - pigpiod
          - pigpio-tools
          - pipewire
          - pipewire-alsa
          - python3-rpi-lgpio
          - rsync
          - tmux
          - vim-tiny
          - vlc-bin
          - vlc-plugin-base
          - wireplumber

    - name: Install java packages
      become: true
      ansible.builtin.apt:
        default_release: bookworm-backports
        name:
          # from azul repo
          - zulu{{ java_version }}-ca-jdk-headless
        state: present
        update_cache: true
        cache_valid_time: 3600
      tags: [java]

    - name: Check if correct bb version is installed
      ansible.builtin.shell: /usr/local/bin/bb --version | grep -q {{ babashka_version }}
      register: bb_version_check
      failed_when: false
      changed_when: false
      tags:
        - babashka

    - name: Install babashka
      become: true
      args:
        chdir: /tmp
      ansible.builtin.shell: |
        set -xe
        curl --fail -OL https://github.com/babashka/babashka/releases/download/v{{ babashka_version }}/babashka-{{ babashka_version }}-linux-aarch64-static.tar.gz
        tar -xzf babashka-{{ babashka_version }}-linux-aarch64-static.tar.gz
        rm -rf babashka-{{ babashka_version }}-linux-aarch64-static.tar.gz
        mv ./bb /usr/local/bin/bb
      when:
        - bb_version_check.rc != 0
      tags:
        - babashka

    - name: Ensure dtoverlay=hifiberry-dac exists
      become: true
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        regexp: "^dtparam=hifiberry-dac"
        line: dtoverlay=hifiberry-dac
        state: present

    - name: Ensure dtoverlay=spi0-1cs,cs0_pin=8 exists
      become: true
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        line: dtoverlay=spi0-1cs,cs0_pin=8
        state: present

    - name: Ensure dtparam=audio=on does NOT exist
      become: true
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        regexp: "^dtparam=audio.*"
        state: absent

    - name: Modify dtoverlay=vc4-kms-v3d to dtoverlay=vc4-kms-v3d,noaudio
      become: true
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        regexp: "^dtoverlay=vc4-kms-v3d.*"
        line: dtoverlay=vc4-kms-v3d,noaudio

    - name: Turn on Next/Prev LEDs very very early to show that something is happening
      become: true
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        line: "{{ item }}"
        state: present
      loop:
        - "# turn on the next/prev leds right at boot to show something is happening"
        - gpio=7=op,dh
        - gpio=14=op,dh

    - name: Ensure pigpiod.service directory exists for overrides
      become: true
      ansible.builtin.file:
        path: /etc/systemd/system/pigpiod.service.d
        state: directory

    - name: Create override.conf for pigpiod.service
      become: true
      ansible.builtin.copy:
        dest: /etc/systemd/system/pigpiod.service.d/override.conf
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/bin/pigpiod -l -n 127.0.0.1 -t0
      notify: restart pigpiod

    - name: Enable pigpiod
      become: true
      ansible.builtin.systemd_service:
        name: pigpiod.service
        state: started
        enabled: true

    - name: Udev rules
      become: true
      ansible.builtin.copy:
        content: |
          SUBSYSTEM=="bcm2835-gpiomem", KERNEL=="gpiomem", GROUP="gpio",MODE="0660"
          SUBSYSTEM=="bcm2711-gpiomem", KERNEL=="gpiomem", GROUP="gpio",MODE="0660"
          SUBSYSTEM=="gpio", KERNEL=="gpiochip*", ACTION=="add", RUN+="/usr/bin/bash -c 'chown root:gpio  /sys/class/gpio/export /sys/class/gpio/unexport ; chmod 220 /sys/class/gpio/export /sys/class/gpio/unexport'"
          SUBSYSTEM=="gpio", KERNEL=="gpio*", ACTION=="add",RUN+="/usr/bin/bash -c 'chown root:gpio /sys%p/active_low /sys%p/direction /sys%p/edge /sys%p/value ; chmod 660 /sys%p/active_low /sys%p/direction /sys%p/edge /sys%p/value'"
          SUBSYSTEM=="i2c-dev", GROUP="i2c",  MODE="0666"
          SUBSYSTEM=="spidev", GROUP="spi", MODE="0660"
        dest: /etc/udev/rules.d/50-fairybox.rules
        owner: root
        group: root
        mode: 0755
      notify: reload udev

    - name: Create /var/lib/fairybox directory
      become: true
      ansible.builtin.file:
        path: /var/lib/fairybox
        state: directory
        owner: ramblurr
        group: ramblurr
        mode: "0750"

    - name: Create Fairybox release directories
      become: true
      tags: [app, deploy-tools]
      ansible.builtin.file:
        path: "/var/lib/fairybox/{{ item }}"
        state: directory
        owner: ramblurr
        group: ramblurr
        mode: "0750"
      loop:
        - releases
        - incoming

    - name: Create /srv/media directory
      become: true
      ansible.builtin.file:
        path: /srv/media
        state: directory
        owner: ramblurr
        group: ramblurr
        mode: "0750"

    - name: Enable systemd lingering for ramblurr
      become: true
      ansible.builtin.command:
        cmd: loginctl enable-linger ramblurr
      args:
        creates: /var/lib/systemd/linger/ramblurr

    - name: Ensure ramblurr is added to groups
      become: true
      ansible.builtin.user:
        name: ramblurr
        groups: gpio,spi,i2c,audio
        append: true

    - name: Configure authbind
      become: true
      ansible.builtin.file:
        path: /etc/authbind/byport/80
        state: touch
        access_time: preserve
        modification_time: preserve
        owner: ramblurr
        group: root
        mode: "0755"

    - name: Inspect managed Fairybox current release
      become: true
      tags: [app, deploy-tools]
      ansible.builtin.stat:
        path: /var/lib/fairybox/current
        follow: false
      register: fairybox_current_release

    - name: Require an explicitly migrated Fairybox release
      become: true
      tags: [app, deploy-tools]
      ansible.builtin.assert:
        that:
          - fairybox_current_release.stat.exists
          - fairybox_current_release.stat.islnk
        fail_msg: >-
          /var/lib/fairybox/current must be an explicitly provisioned release
          symlink before installing the managed launcher. Perform the one-time
          release migration separately.

    - name: Install Fairybox production launcher
      become: true
      tags: [app, deploy-tools]
      ansible.builtin.copy:
        src: scripts/fairybox-launch
        dest: /usr/local/bin/fairybox-launch
        owner: root
        group: root
        mode: "0755"
      notify: restart fairybox

    - name: Install Fairybox release deploy command
      become: true
      tags: [app, deploy-tools]
      ansible.builtin.copy:
        src: scripts/fairybox-deploy
        dest: /usr/local/bin/fairybox-deploy
        owner: root
        group: root
        mode: "0755"

    - name: Create ~/.config/systemd/user/ directory
      tags: [app]
      ansible.builtin.file:
        path: /home/ramblurr/.config/systemd/user
        state: directory
        owner: ramblurr
        group: ramblurr
        mode: "0750"

    - name: Create fairybox-startup.service systemd unit file
      tags: [app]
      become: true
      ansible.builtin.copy:
        dest: /etc/systemd/system/fairybox-startup.service
        content: |
          [Unit]
          Description=fairybox startup animation
          DefaultDependencies=no
          After=local-fs.target

          [Service]
          Type=simple
          WorkingDirectory=/var/lib/fairybox
          ExecStart=/usr/bin/python3 /var/lib/fairybox/fairybox/scripts/startup-pre.py
          User=ramblurr
          Environment="FAIRYBOX_API=http://localhost/api"
          Restart=no

          [Install]
          WantedBy=basic.target

    - name: Create fairybox.service systemd unit file
      tags: [app]
      ansible.builtin.copy:
        dest: /home/ramblurr/.config/systemd/user/fairybox.service
        content: |
          [Unit]
          Description=fairybox
          Wants=pipewire.service

          [Service]
          Type=simple
          WorkingDirectory=/var/lib/fairybox
          ExecStart=/usr/local/bin/fairybox-launch
          Environment="NREPL_HOST=0.0.0.0"
          Environment="PORT=80"
          Environment="DB_PATH=/var/lib/fairybox/db.edn"
          Environment="MEDIA_DIR=/srv/media"
          EnvironmentFile=/var/lib/fairybox/secret-env
          Restart=on-failure
          TimeoutStopSec=60

          [Install]
          WantedBy=default.target
      notify: restart fairybox

    - name: Enable and start fairybox service
      tags: [app]
      ansible.builtin.systemd_service:
        scope: user
        name: fairybox.service
        enabled: true
        state: started
        daemon_reload: true
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ user_uid }}"

    - name: Install gpio-shutoff
      become: true
      tags: [onoff]
      ansible.builtin.copy:
        content: |
          #!/usr/bin/bash
          set -e
          poweroff_pin="4"
          if [ "$1" = "poweroff" ]; then
            /usr/bin/pinctrl set "$poweroff_pin" op dl
          fi
        dest: /usr/lib/systemd/system-shutdown/gpio-shutoff
        owner: root
        group: root
        mode: 0755

    - name: Install onoff-shim-trigger
      become: true
      tags: [onoff]
      ansible.builtin.copy:
        content: |
          #!/usr/bin/bash
          set -euo pipefail
          trigger_pin="17"
          led_pin="17"
          shutdown_url="http://127.0.0.1/api/shutdown"
          grace_period_seconds="30"
          /usr/bin/pinctrl set "$trigger_pin" ip
          power=$(/usr/bin/pinctrl get "$trigger_pin" | awk '{print $5}')
          if [ "$power" = "hi" ]; then
            switchtype="lo" # Momentary button
          elif [ "$power" = "lo" ]; then
            switchtype="hi" # Not a momentary button
          else
            echo "Failed getting trigger_pin=$trigger_pin value (got: '$power')"
            exit 1
          fi
          until [ "$power" = "$switchtype" ]; do
            power=$(/usr/bin/pinctrl get "$trigger_pin" | awk '{print $5}')
            /usr/bin/sleep 1
          done
          /usr/bin/pinctrl set "$led_pin" op
          # Blink the LED
          for _ in 1 2 3 5 6 7 8; do
            /usr/bin/pinctrl set "$led_pin" dl
            /usr/bin/sleep 0.2
            /usr/bin/pinctrl set "$led_pin" dh
            /usr/bin/sleep 0.2
          done
          echo "Requesting graceful Fairybox poweroff"
          if /usr/bin/curl \
            --fail \
            --silent \
            --show-error \
            --connect-timeout 2 \
            --max-time 5 \
            --header "Accept-Encoding: br" \
            --header "Sec-Fetch-Site: same-origin" \
            --cookie "__Host-sid=onoff-shim-trigger" \
            --request POST \
            "$shutdown_url"; then
            echo "Graceful poweroff request accepted"
            for ((attempt = 1; attempt <= grace_period_seconds; attempt++)); do
              system_state=$(/usr/bin/systemctl is-system-running 2>/dev/null || true)
              case "$system_state" in
                stopping|offline)
                  echo "System shutdown has begun"
                  exit 0
                  ;;
              esac
              /usr/bin/sleep 1
            done
            echo "Graceful poweroff deadline expired; forcing host poweroff" >&2
          else
            echo "Graceful poweroff request failed; forcing host poweroff" >&2
          fi
          /usr/bin/systemctl poweroff
        dest: /usr/local/bin/onoff-shim-trigger
        owner: root
        group: root
        mode: 0755
      notify: restart onoff-trigger

    - name: Create onoff-trigger.service systemd unit file
      become: true
      tags: [onoff]
      ansible.builtin.copy:
        dest: /etc/systemd/system/onoff-trigger.service
        content: |
          [Unit]
          Description=OnOff SHIM daemon
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/onoff-shim-trigger
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
      notify: restart onoff-trigger

    - name: Enable and start onoff-trigger service
      become: true
      tags: [onoff]
      ansible.builtin.systemd_service:
        name: onoff-trigger
        enabled: true
        state: started

    - name: Create policy kit file to allow passwordless shutdown
      become: true
      tags: [onoff]
      ansible.builtin.copy:
        dest: /var/lib/polkit-1/localauthority/50-local.d/custom-actions.pkla
        content: |
          [Actions for ramblurr user]
          Identity=unix-user:ramblurr
          Action=org.freedesktop.login1.power-off;
          ResultAny=yes
          ResultInactive=no
          ResultActive=yes
      notify: restart polkit

  handlers:
    - name: restart polkit
      become: true
      ansible.builtin.systemd_service:
        name: polkit.service
        state: restarted

    - name: restart pigpiod
      become: true
      ansible.builtin.systemd_service:
        name: pigpiod.service
        state: restarted
        daemon_reload: true
        enabled: true

    - name: enable fairybox-startup
      become: true
      ansible.builtin.systemd_service:
        name: fairybox-startup.service
        state: restarted
        daemon_reload: true
        enabled: true

    - name: restart fairybox
      ansible.builtin.systemd_service:
        name: fairybox.service
        state: restarted
        daemon_reload: true
        enabled: true
        scope: user
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ user_uid }}"

    - name: restart onoff-trigger
      become: true
      tags: [onoff]
      ansible.builtin.systemd_service:
        name: onoff-trigger.service
        state: restarted
        daemon_reload: true
        enabled: true

    - name: reload udev
      become: true
      ansible.builtin.shell: udevadm control --reload-rules && udevadm trigger
